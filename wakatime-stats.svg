    .empty { fill: #94a3b8; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .track { fill: #1e293b; }
    .bar { fill: #38bdf8; }
  </style>
  <rect width="100%" height="100%" rx="12" fill="#0f172a" />
  <text x="24" y="32" class="title">Most used languages</text>
